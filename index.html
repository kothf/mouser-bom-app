<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=http://localhost:3000">
  <title>Mouser BOM Studio Launcher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #020617;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 36px 32px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: #3b82f6;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #ffffff;
    }
    p.subtitle {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .status-box {
      background: #090d16;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 14px;
      font-size: 13px;
      color: #cbd5e1;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(59, 130, 246, 0.2);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .btn {
      display: inline-block;
      width: 100%;
      background: #2563eb;
      color: white;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      padding: 12px 20px;
      border-radius: 10px;
      transition: background 0.15s ease;
      cursor: pointer;
      border: none;
    }
    .btn:hover {
      background: #1d4ed8;
    }
    .zx-spectrum-badge {
      white-space: nowrap;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(6, 182, 212, 0.4);
      border-radius: 4px;
      flex-wrap: nowrap;
      flex-shrink: 0;
      align-items: center;
      gap: 7px;
      max-width: 100%;
      padding: 4px 10px;
      display: inline-flex;
      box-shadow: 0 0 10px rgba(6, 182, 212, 0.15);
    }
    .zx-spectrum-text {
      letter-spacing: 0.5px;
      color: #38bdf8;
      text-shadow: 0 0 8px rgba(56, 189, 248, 0.5);
      image-rendering: pixelated;
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      line-height: 1;
    }
    .zx-rainbow-stripe {
      background: linear-gradient(135deg, #ef4444 0% 25%, #eab308 25% 50%, #22c55e 50% 75%, #06b6d4 75% 100%);
      border-radius: 1px;
      flex-shrink: 0;
      width: 14px;
      height: 9px;
      display: inline-block;
      box-shadow: 0 0 4px rgba(255, 255, 255, 0.25);
    }
    .hint {
      margin-top: 18px;
      font-size: 12px;
      color: #64748b;
      line-height: 1.4;
    }
    code {
      font-family: monospace;
      background: #1e293b;
      color: #38bdf8;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
    }
  </style>
  <script>
    // Immediate redirect attempt
    window.location.replace("http://localhost:3000");

    // Fallback polling if redirect did not instantly replace page
    let checkAttempts = 0;
    async function checkServer() {
      try {
        const res = await fetch("http://localhost:3000/api/mouser/verify", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ key: "test" }),
          signal: credentialsSignal(1500)
        });
        window.location.href = "http://localhost:3000";
      } catch (e) {
        checkAttempts++;
        const statusEl = document.getElementById("status-text");
        if (statusEl) {
          if (checkAttempts > 2) {
            statusEl.innerText = "Connecting to http://localhost:3000...";
          }
        }
        setTimeout(checkServer, 1000);
      }
    }

    function credentialsSignal(ms) {
      const controller = new AbortController();
      setTimeout(() => controller.abort(), ms);
      return controller.signal;
    }

    setTimeout(checkServer, 1000);
  </script>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect width="18" height="18" x="3" y="3" rx="2"></rect>
        <path d="M7 7h.01"></path>
        <path d="M17 7h.01"></path>
        <path d="M7 17h.01"></path>
        <path d="M17 17h.01"></path>
      </svg>
    </div>

    <h1>Mouser BOM Studio</h1>
    <p class="subtitle">Electronics Bill of Materials &amp; Shopping Cart Automation</p>

    <div style="margin-bottom: 22px;">
      <div class="zx-spectrum-badge">
        <span class="zx-rainbow-stripe" aria-hidden="true"></span>
        <span class="zx-spectrum-text">Designed by Andrey Dumchin - 4X5VA</span>
        <span class="zx-rainbow-stripe" aria-hidden="true"></span>
      </div>
    </div>

    <div class="status-box">
      <div class="spinner"></div>
      <span id="status-text">Redirecting to application...</span>
    </div>

    <a href="http://localhost:3000" class="btn">Open App Now</a>

    <p class="hint">
      The server runs as a background service (<code>mouser-bom.service</code>).<br>
      If not running, start with: <code>systemctl --user start mouser-bom</code>
    </p>
  </div>
</body>
</html>
