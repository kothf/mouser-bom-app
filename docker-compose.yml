services:
  mouser-bom:
    # Prebuilt image published by the Release workflow (served under /bom).
    # Update the server with: docker compose pull && docker compose up -d
    image: ghcr.io/kothf/mouser-bom-app:latest
    pull_policy: always
    # Fallback: `docker compose up -d --build` builds locally instead.
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: /bom
    container_name: mouser-bom
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BASE_PATH=/bom
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # Optional server-side DigiKey credentials (read from the host env / .env, never committed)
      - DIGIKEY_CLIENT_ID=${DIGIKEY_CLIENT_ID:-}
      - DIGIKEY_CLIENT_SECRET=${DIGIKEY_CLIENT_SECRET:-}
    volumes:
      # Keeps saved Mouser and DigiKey BOMs across container updates
      - bom-data:/app/data
    networks:
      - proxy
    # No ports exposed to host. Maximum security via internal Docker network only.

volumes:
  bom-data:

networks:
  proxy:
    external: true
